<svg xmlns="http://www.w3.org/2000/svg" width="440" height="404" viewBox="0 0 440 404" role="img" aria-labelledby="veri-t veri-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="veri-t">VerifAI</title>
<desc id="veri-d">VerifAI, AI-powered skill verification platform. Developers solve real-world engineering challenges in the browser. Submissions run in a sandbox through Judge0, get reviewed by AI, and earn verifiable credentials. Stack: React, Node.js, Express, MongoDB, Redis, Bull, Judge0, Gemini API, Socket.io, Monaco Editor. Features: In-browser editor with hidden test cases; Code execution through Judge0; AI scoring for scalability and readability; Asynchronous submission processing; Achievement badges and public profiles.</desc>
