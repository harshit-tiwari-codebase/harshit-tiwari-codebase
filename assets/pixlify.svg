<svg xmlns="http://www.w3.org/2000/svg" width="435" height="350" viewBox="0 0 435 350" role="img" aria-labelledby="pix-t pix-d">
  <title id="pix-t">Pixlify - Social Media Platform</title>
  <desc id="pix-d">Full stack social media platform with Redis caching, feed generation, and media storage.</desc>
  <defs>
    <style>
      .badge { fill: #8B5CF6; fill-opacity: 0.14; stroke: #8B5CF6; stroke-opacity: 0.5; stroke-width: 1; rx: 5px; }
      .badge-txt { font-size: 11px; font-weight: 500; fill: #FAFAFA; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="434" height="349" rx="10" fill="#18181B" stroke="#27272A" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Top Indicator -->
    <rect x="22" y="24" width="3" height="20" rx="1.5" fill="#8B5CF6" />
    <text x="32" y="39" font-size="18" font-weight="700" fill="#FAFAFA">Pixlify</text>
    <text x="22" y="62" font-size="12" font-weight="500" fill="#A78BFA">Full-Stack Social Platform &amp; Feed Engine</text>

    <!-- One-line Problem/Value -->
    <text x="22" y="88" font-size="13" fill="#A1A1AA">Production-style social platform with personalized feed</text>
    <text x="22" y="106" font-size="13" fill="#A1A1AA">generation, user graph management, and habit challenges.</text>

    <!-- Tech Stack Row 1 -->
    <g transform="translate(22, 122)">
      <rect x="0" y="0" width="60" height="22" class="badge" />
      <text x="30" y="11" class="badge-txt">React.js</text>

      <rect x="66" y="0" width="48" height="22" class="badge" />
      <text x="24" y="11" class="badge-txt" transform="translate(66,0)">Vite</text>

      <rect x="120" y="0" width="84" height="22" class="badge" />
      <text x="42" y="11" class="badge-txt" transform="translate(120,0)">Tailwind CSS</text>

      <rect x="210" y="0" width="60" height="22" class="badge" />
      <text x="30" y="11" class="badge-txt" transform="translate(210,0)">Node.js</text>

      <rect x="276" y="0" width="60" height="22" class="badge" />
      <text x="30" y="11" class="badge-txt" transform="translate(276,0)">Express</text>

      <rect x="342" y="0" width="66" height="22" class="badge" />
      <text x="33" y="11" class="badge-txt" transform="translate(342,0)">MongoDB</text>
    </g>

    <!-- Tech Stack Row 2 -->
    <g transform="translate(22, 150)">
      <rect x="0" y="0" width="50" height="22" class="badge" />
      <text x="25" y="11" class="badge-txt">Redis</text>

      <rect x="56" y="0" width="68" height="22" class="badge" />
      <text x="34" y="11" class="badge-txt" transform="translate(56,0)">ImageKit</text>

      <rect x="130" y="0" width="70" height="22" class="badge" />
      <text x="35" y="11" class="badge-txt" transform="translate(130,0)">JWT Auth</text>

      <rect x="206" y="0" width="94" height="22" class="badge" />
      <text x="47" y="11" class="badge-txt" transform="translate(206,0)">Redux Toolkit</text>
    </g>

    <line x1="22" y1="184" x2="412" y2="184" stroke="#27272A" stroke-width="1" />

    <!-- Engineering Highlights -->
    <g transform="translate(22, 196)">
      <circle cx="5" cy="11" r="2.5" fill="#8B5CF6" />
      <text x="16" y="15" font-size="12.5" fill="#FAFAFA">Redis caching layer to accelerate feed and profile queries</text>

      <circle cx="5" cy="34" r="2.5" fill="#8B5CF6" />
      <text x="16" y="38" font-size="12.5" fill="#FAFAFA">Normalized MongoDB schemas for follows, posts &amp; comments</text>

      <circle cx="5" cy="57" r="2.5" fill="#8B5CF6" />
      <text x="16" y="61" font-size="12.5" fill="#FAFAFA">ImageKit integration for optimized cloud media transformations</text>

      <circle cx="5" cy="80" r="2.5" fill="#8B5CF6" />
      <text x="16" y="84" font-size="12.5" fill="#FAFAFA">JWT session authentication and protected API endpoints</text>
    </g>

    <text x="22" y="328" font-size="11" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#71717A">github.com/harshit-tiwari-codebase/pixlify-mern</text>
  </g>
</svg>
