<svg xmlns="http://www.w3.org/2000/svg" width="440" height="404" viewBox="0 0 440 404" role="img" aria-labelledby="pixl-t pixl-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="pixl-t">Pixlify</title>
<desc id="pixl-d">Pixlify, Full-stack social media platform. An Instagram-inspired social app covering authentication, a post feed, follows, comments, and image uploads, with Redis-based caching. Stack: React, Vite, Tailwind CSS, Redux Toolkit, Node.js, Express, MongoDB, Mongoose, Redis, ImageKit, JWT. Features: JWT-based user authentication; Feed, post management, follow system, comments; Habit tracking and challenges; Image uploads through ImageKit; Redis-based caching.</desc>
