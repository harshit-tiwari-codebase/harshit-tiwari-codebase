<svg xmlns="http://www.w3.org/2000/svg" width="440" height="404" viewBox="0 0 440 404" role="img" aria-labelledby="trac-t trac-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="trac-t">TraceMail</title>
<desc id="trac-d">TraceMail, AI-powered email threat intelligence platform. Analyzes email files for phishing signals and failed authentication, scores the risk, and records evidence integrity with SHA-256. Stack: React, TypeScript, Vite, Tailwind CSS, Node.js, Express, Python, FastAPI, Redis. Features: Email file analysis and phishing detection; SPF, DKIM and DMARC verification; Relay-chain analysis; IP and domain intelligence with risk scoring; SHA-256 evidence integrity.</desc>
