<title id="emot-t">Emotify</title>
<desc id="emot-d">Emotify, Emotion detection and music recommendation. Reads emotion from facial expressions with MediaPipe and recommends music that matches the mood. Stack: React, Vite, Tailwind CSS, MediaPipe, Node.js, Express, MongoDB, Google Generative AI. Features: Facial emotion detection and classification; Mood-based music recommendations; AI integration through Google Generative AI.</desc>
