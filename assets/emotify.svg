<svg xmlns="http://www.w3.org/2000/svg" width="435" height="350" viewBox="0 0 435 350" role="img" aria-labelledby="emot-t emot-d">
  <title id="emot-t">Emotify - Mood-Based Audio Recommendation</title>
  <desc id="emot-d">Computer vision application utilizing facial expression analysis to dynamically deliver tailored music recommendations.</desc>
  <defs>
    <style>
      .badge { fill: #8B5CF6; fill-opacity: 0.14; stroke: #8B5CF6; stroke-opacity: 0.5; stroke-width: 1; rx: 5px; }
      .badge-txt { font-size: 11px; font-weight: 500; fill: #FAFAFA; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="434" height="349" rx="10" fill="#18181B" stroke="#27272A" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Top Indicator -->
    <rect x="22" y="24" width="3" height="20" rx="1.5" fill="#8B5CF6" />
    <text x="32" y="39" font-size="18" font-weight="700" fill="#FAFAFA">Emotify</text>
    <text x="22" y="62" font-size="12" font-weight="500" fill="#A78BFA">Vision-Driven Music Recommendation</text>

    <!-- One-line Problem/Value -->
    <text x="22" y="88" font-size="13" fill="#A1A1AA">Real-time facial emotion recognition pipeline mapping detected</text>
    <text x="22" y="106" font-size="13" fill="#A1A1AA">mood states to personalized generative music playlists.</text>

    <!-- Tech Stack Row 1 -->
    <g transform="translate(22, 122)">
      <rect x="0" y="0" width="50" height="22" class="badge" />
      <text x="25" y="11" class="badge-txt">React</text>

      <rect x="56" y="0" width="60" height="22" class="badge" />
      <text x="86" y="11" class="badge-txt">Node.js</text>

      <rect x="122" y="0" width="60" height="22" class="badge" />
      <text x="152" y="11" class="badge-txt">Express</text>

      <rect x="188" y="0" width="66" height="22" class="badge" />
      <text x="221" y="11" class="badge-txt">MongoDB</text>

      <rect x="260" y="0" width="76" height="22" class="badge" />
      <text x="298" y="11" class="badge-txt">MediaPipe</text>
    </g>

    <!-- Tech Stack Row 2 -->
    <g transform="translate(22, 150)">
      <rect x="0" y="0" width="136" height="22" class="badge" />
      <text x="68" y="11" class="badge-txt">Google Generative AI</text>

      <rect x="142" y="0" width="94" height="22" class="badge" />
      <text x="189" y="11" class="badge-txt">FaceLandmarker</text>
    </g>

    <line x1="22" y1="184" x2="412" y2="184" stroke="#27272A" stroke-width="1" />

    <!-- Engineering Highlights -->
    <g transform="translate(22, 196)">
      <circle cx="5" cy="11" r="2.5" fill="#8B5CF6" />
      <text x="16" y="15" font-size="12.5" fill="#FAFAFA">Real-time landmark tracking via MediaPipe FaceLandmarker</text>

      <circle cx="5" cy="34" r="2.5" fill="#8B5CF6" />
      <text x="16" y="38" font-size="12.5" fill="#FAFAFA">Low-latency client-side facial analysis without raw video uploads</text>

      <circle cx="5" cy="57" r="2.5" fill="#8B5CF6" />
      <text x="16" y="61" font-size="12.5" fill="#FAFAFA">AI-assisted mood-to-music genre semantics translation</text>

      <circle cx="5" cy="80" r="2.5" fill="#8B5CF6" />
      <text x="16" y="84" font-size="12.5" fill="#FAFAFA">Structured playlist schema storage and user history indexing</text>
    </g>

    <text x="22" y="328" font-size="11" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#71717A">github.com/harshit-tiwari-codebase/emotify</text>
  </g>
</svg>
