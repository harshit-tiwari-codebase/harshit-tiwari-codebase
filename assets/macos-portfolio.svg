<svg xmlns="http://www.w3.org/2000/svg" width="280" height="240" viewBox="0 0 280 240" role="img" aria-labelledby="mac-t mac-d">
  <title id="mac-t">macOS Interactive Portfolio</title>
  <desc id="mac-d">Desktop-style portfolio simulating macOS windowing, dock interactions, notes, and terminal.</desc>
  <defs>
    <style>
      .badge { fill: #8B5CF6; fill-opacity: 0.14; stroke: #8B5CF6; stroke-opacity: 0.5; stroke-width: 1; rx: 5px; }
      .badge-txt { font-size: 10.5px; font-weight: 500; fill: #FAFAFA; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="279" height="239" rx="10" fill="#18181B" stroke="#27272A" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Window controls -->
    <circle cx="20" cy="20" r="4.5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="34" cy="20" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="48" cy="20" r="4.5" fill="#10B981" fill-opacity="0.8" />

    <text x="20" y="52" font-size="16" font-weight="700" fill="#FAFAFA">macOS Portfolio</text>
    <text x="20" y="70" font-size="11.5" font-weight="500" fill="#A78BFA">Desktop Simulation Environment</text>

    <text x="20" y="96" font-size="12" fill="#A1A1AA">Interactive personal portfolio with</text>
    <text x="20" y="112" font-size="12" fill="#A1A1AA">window management, dock, terminal</text>
    <text x="20" y="128" font-size="12" fill="#A1A1AA">emulator, and markdown notes.</text>

    <!-- Badges -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="50" height="20" class="badge" />
      <text x="25" y="10" class="badge-txt">React</text>

      <rect x="56" y="0" width="80" height="20" class="badge" />
      <text x="96" y="10" class="badge-txt">Tailwind CSS</text>

      <rect x="142" y="0" width="88" height="20" class="badge" />
      <text x="186" y="10" class="badge-txt">Framer Motion</text>
    </g>

    <line x1="20" y1="176" x2="260" y2="176" stroke="#27272A" stroke-width="1" />

    <text x="20" y="200" font-size="11" fill="#FAFAFA">Windowing &amp; state management</text>
    <text x="20" y="222" font-size="10" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#71717A">github.com/.../macos-dev-portfolio</text>
  </g>
</svg>
